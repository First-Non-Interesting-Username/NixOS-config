name: Build ISOs and create release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Version tag using 0ver (e.g., v0.1.0)"
        required: true
        type: string
      issue_numbers:
        description: "Comma-separated PR/Issue numbers (e.g., 12,446,266)"
        required: true
        type: string
      releaseDescription:
        description: "Optional description for the release"
        required: false
        type: string

jobs:
  check:
    uses: ./.github/workflows/flake-check.yaml
    permissions:
      contents: read

  build:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.PAT }}

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: matrix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          installCommand: "nix profile add nixpkgs#cachix"

      - name: Build John
        run: nix build .#john

      - name: Prepare ISO and Generate Checksum
        id: checksum
        run: |
          mkdir -p upload_stage
          SAFE_NAME="${{ github.event.inputs.tag_name }}"
          SAFE_NAME="${SAFE_NAME//./-}"
          ISO_NAME="${SAFE_NAME}-john.iso"
          echo "safe_name=$SAFE_NAME" >> "$GITHUB_OUTPUT"
          cp -L ./result/iso/*.iso ./upload_stage/$ISO_NAME
          cd upload_stage
          sha256sum "$ISO_NAME" > "${ISO_NAME}.sha256"

      - name: Copy file via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 frs.sourceforge.net >> ~/.ssh/known_hosts

          scp -v -P 22 \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            "upload_stage/${{ steps.checksum.outputs.safe_name }}-john.iso" \
            "upload_stage/${{ steps.checksum.outputs.safe_name }}-john.iso.sha256" \
            "${{ secrets.SF_USERNAME }}@frs.sourceforge.net:/home/frs/project/nixos-config/"

      - name: Upload Checksum Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: checksum-john
          path: upload_stage/${{ steps.checksum.outputs.safe_name }}-john.iso.sha256

  release:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - name: Download Checksum Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: checksum-*
          merge-multiple: true

      - name: Extract Checksums
        id: extract-checksums
        run: |
          HASH=$(awk '{ print $1 }' *-john.iso.sha256)
          echo "sha256_john=$HASH" >> "$GITHUB_OUTPUT"

      - name: Create safe name
        id: safe_name
        run: |
          SAFE_NAME="${{ github.event.inputs.tag_name }}"
          SAFE_NAME="${SAFE_NAME//./-}"
          echo "safe_name=$SAFE_NAME" >> "$GITHUB_OUTPUT"

      - name: Format Issue List
        id: format_issues
        run: |
          RAW="${{ github.event.inputs.issue_numbers }}"
          FORMATTED=$(echo "$RAW" | sed 's/ //g; s/^/- #/; s/,/\n- #/g')
          {
            echo "LIST<<EOF"
            echo "$FORMATTED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: "Release ${{ github.event.inputs.tag_name }}"
          files: "*.sha256"
          body: |
            # NixOS Configuration Release
            ${{ github.event.inputs.releaseDescription }}

            ## Downloads

            ### John (Graphical)
            * **[Download ISO from SourceForge](https://sourceforge.net/projects/nixos-config/files/${{ steps.safe_name.outputs.safe_name }}-john.iso/download)**
            * **SHA256:** ${{ steps.extract-checksums.outputs.sha256_john }}

            Notable changes:

            ${{ steps.format_issues.outputs.LIST }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  reminder:
    runs-on: ubuntu-latest
    needs: [release, build]
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create maintenance reminder
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -e
          EXISTING_ISSUE=$(gh issue list --search "SourceForge Cleanup" --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING_ISSUE" ]; then
            gh issue create \
              --title "Manual SourceForge Cleanup Required" \
              --body "The release **${{ github.event.inputs.tag_name }}** was uploaded. SourceForge does not have automated pruning, and only the latest ISO should be available at a time. Please manually remove all older ISOs. Steps: 1) Go to https://sourceforge.net/projects/nixos-config/ 2) Click files 3) Remove old ISOs"
          else
            gh issue comment "$EXISTING_ISSUE" --body "Another release (${{ github.event.inputs.tag_name }}) has been pushed. Reminder to clean up old ISOs."
          fi
