name: Build ISOs and create release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Version tag using 0ver (e.g., v0.1.0)"
        required: true
        type: string
      issue_numbers:
        description: "Comma-separated PR/Issue numbers (e.g., 12,446,266)"
        required: true
        type: string
      releaseDescription:
        description: "Optional description for the release"
        required: false
        type: string

jobs:
  check:
    uses: ./.github/workflows/flake-check.yaml

  build:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
    strategy:
      matrix:
        host: [john, wall-e]
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT }}

      - uses: wimpysworld/nothing-but-nix@v10
        with:
          hatchet-protocol: cleave

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators

      - uses: cachix/cachix-action@v17
        with:
          name: matrix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          installCommand: "nix profile install nixpkgs#cachix"

      - name: Build
        run: nix build .#${{ matrix.host }}

      - name: Prepare ISO and Generate Checksum
        id: checksum
        run: |
          mkdir -p upload_stage
          SAFE_NAME="${{ github.event.inputs.tag_name }}"
          SAFE_NAME="${SAFE_NAME//./\-}"
          ISO_NAME="${SAFE_NAME}-${{ matrix.host }}.iso"
          echo "safe_name=$SAFE_NAME" >> "$GITHUB_OUTPUT"
          cp -L ./result/iso/*.iso ./upload_stage/$ISO_NAME
          cd upload_stage
          sha256sum "$ISO_NAME" > "${ISO_NAME}.sha256"
          HASH=$(awk '{ print $1 }' "${ISO_NAME}.sha256")
          echo "sha256_${{ matrix.host }}=$HASH" >> "$GITHUB_OUTPUT"

      - name: Copy file via SSH
        uses: appleboy/scp-action@v1.0.0
        with:
          host: frs.sourceforge.net
          username: ${{ secrets.SF_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE }}
          port: 22
          source: "upload_stage/${{ steps.checksum.outputs.safe_name }}-${{ matrix.host }}.iso,upload_stage/${{ steps.checksum.outputs.safe_name }}-${{ matrix.host }}.iso.sha256"
          target: "/home/frs/project/nixos-config/"
          strip_components: 1

      - name: Upload Checksum Artifact
        uses: actions/upload-artifact@v7
        with:
          name: checksum-${{ matrix.host }}
          path: upload_stage/${{ steps.checksum.outputs.safe_name }}-${{ matrix.host }}.iso.sha256

  release:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - name: Download Checksum Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: checksum-*
          merge-multiple: true

      - name: Extract Checksums
        id: extract-checksums
        run: |
          for file in *.sha256; do
            if [[ "$file" == *"-john.iso.sha256" ]]; then
              HASH=$(awk '{ print $1 }' "$file")
              echo "sha256_john=$HASH" >> "$GITHUB_OUTPUT"
            elif [[ "$file" == *"-wall-e.iso.sha256" ]]; then
              HASH=$(awk '{ print $1 }' "$file")
              echo "sha256_wall_e=$HASH" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Create safe name
        id: safe_name
        run: |
          SAFE_NAME="${{ github.event.inputs.tag_name }}"
          SAFE_NAME="${SAFE_NAME//./-}"
          echo "safe_name=$SAFE_NAME" >> "$GITHUB_OUTPUT"

      - name: Format Issue List
        id: format_issues
        run: |
          RAW="${{ github.event.inputs.issue_numbers }}"
          FORMATTED=$(echo "$RAW" | sed 's/ //g; s/^/- #/; s/,/\n- #/g')
          {
            echo "LIST<<EOF"
            echo "$FORMATTED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: "Release ${{ github.event.inputs.tag_name }}"
          files: "*.sha256"
          body: |
            # NixOS Configuration Release
            ${{ github.event.inputs.releaseDescription }}

            ## Downloads

            ### John (Graphical)
            * **[Download ISO from SourceForge](https://sourceforge.net/projects/nixos-config/files/${{ steps.safe_name.outputs.safe_name }}-john.iso/download)**
            * **SHA256:** `${{ steps.extract-checksums.outputs.sha256_john }}`

            ### Wall-E (Non-Graphical)
            * **[Download ISO from SourceForge](https://sourceforge.net/projects/nixos-config/files/${{ steps.safe_name.outputs.safe_name }}-wall-e.iso/download)**
            * **SHA256:** `${{ steps.extract-checksums.outputs.sha256_wall_e }}`

            Notable changes:

            ${{ steps.format_issues.outputs.LIST }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  reminder:
    runs-on: ubuntu-latest
    needs: [release, build]
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create maintenance reminder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          EXISTING_ISSUE=$(gh issue list --search "SourceForge Cleanup" --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING_ISSUE" ]; then
            gh issue create \
              --title "Manual SourceForge Cleanup Required" \
              --body "The release **${{ github.event.inputs.tag_name }}** was uploaded. SourceForge does not have automated pruning, so please manually remove ISOs older than 5 releases ago. Steps: 1) Go to https://sourceforge.net/projects/nixos-config/ 2) Click files 3) Remove old ISOs"
          else
            gh issue comment "$EXISTING_ISSUE" --body "Another release (${{ github.event.inputs.tag_name }}) has been pushed. Reminder to clean up old ISOs."
          fi
