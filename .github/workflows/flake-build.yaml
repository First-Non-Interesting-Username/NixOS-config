name: Flake build
on:
  schedule:
    - cron: "0 8 * * 4"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to checkout"
        required: false
        type: string
      create-issue-on-failure:
        description: "Create issue on failure"
        required: false
        type: boolean
        default: true
      packages:
        description: "JSON array of packages to build"
        required: false
        type: string
        default: "[]"
  pull_request:
    branches: ["main"]
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        required: false
        type: string
        default: ""
      create-issue-on-failure:
        description: "Create issue on failure"
        required: false
        type: boolean
        default: true
      hosts:
        description: "JSON array of hosts to build"
        required: false
        type: string
        default: "[]"
      packages:
        description: "JSON array of packages to build"
        required: false
        type: string
        default: "[]"
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
    outputs:
      built-targets:
        description: "JSON list of targets attempted"
        value: ${{ jobs.discover.outputs.matrix }}

jobs:
  check-changed-files:
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.filter.outputs.nix || github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            nix:
              - added|modified:
                - "flake.nix"
                - "flake.lock"
                - "**/*.nix"

  discover:
    runs-on: ubuntu-latest
    needs: check-changed-files
    if: needs.check-changed-files.outputs.has-changes == 'true'
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
      - name: Generate build matrix
        id: list
        run: |
          HOSTS=$(nix eval .#nixosConfigurations --apply 'n: builtins.map (name: { inherit name; type = "host"; }) (builtins.attrNames n)' --json)

          PKGS=$(nix eval .#packages.x86_64-linux --apply 'n: builtins.map (name: { inherit name; type = "pkg"; }) (builtins.attrNames n)' --json)

          H_FILTER='${{ inputs.hosts }}'
          if [ "$H_FILTER" != "[]" ] && [ -n "$H_FILTER" ]; then
            HOSTS=$(echo "$HOSTS" | jq --argjson filter "$H_FILTER" '[.[] | select(.name as $n | $filter | index($n))]')
          fi

          P_FILTER='${{ inputs.packages }}'
          if [ "$P_FILTER" != "[]" ] && [ -n "$P_FILTER" ]; then
            PKGS=$(echo "$PKGS" | jq --argjson filter "$P_FILTER" '[.[] | select(.name as $n | $filter | index($n))]')
          fi

          MATRIX=$(jq -cn --argjson h "$HOSTS" --argjson p "$PKGS" '$h + $p')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Enable aarch64 via QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: wimpysworld/nothing-but-nix@v10
        with:
          hatchet-protocol: cleave

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            build-dir = /nix/build

      - uses: cachix/cachix-action@v17
        with:
          name: matrix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build ${{ matrix.target.type }}:${{ matrix.target.name }}
        run: |
          if [ "${{ matrix.target.type }}" = "host" ]; then
            nix build .#nixosConfigurations.${{ matrix.target.name }}.config.system.build.toplevel
          else
            nix build .#${{ matrix.target.name }}
          fi

  report:
    runs-on: ubuntu-latest
    needs: build
    if: failure() && (inputs.create-issue-on-failure == true || inputs.create-issue-on-failure == '')
    permissions:
      issues: write
    steps:
      - name: Report failures to issue
        uses: actions/github-script@v8
        with:
          script: |
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            const failed = jobs.jobs
              .filter(j => j.conclusion === 'failure' && (j.name.includes('host') || j.name.includes('pkg')))
              .map(j => `- \`${j.name}\` — [logs](${j.html_url})`)
              .join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'ci-failure',
              state: 'open'
            });
            const title = 'Flake build failures';
            const body = `## Flake Build Failures\n\n` +
              `**Workflow:** ${context.workflow}\n` +
              `**Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n` +
              `### Failed targets\n${failed || 'Unknown — check run logs'}`;

            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-failure']
              });
            }

  all-systems-passed:
    runs-on: ubuntu-latest
    needs: [check-changed-files, build]
    if: always()
    steps:
      - name: Check build status
        if: >-
          needs.check-changed-files.result == 'failure' ||
          (needs.build.result != 'success' && needs.build.result != 'skipped')
        run: exit 1
