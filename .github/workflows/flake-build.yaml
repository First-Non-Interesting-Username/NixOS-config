name: Flake build

on:
  schedule:
    - cron: "0 8 * * 4"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to checkout"
        required: false
        type: string
      create-issue-on-failure:
        description: "Create issue on failure"
        required: false
        type: boolean
        default: true
  pull_request:
    branches: ["main"]
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        required: false
        type: string
        default: ""
      create-issue-on-failure:
        description: "Create issue on failure"
        required: false
        type: boolean
        default: true
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false

jobs:
  check-changed-files:
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.filter.outputs.nix || github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            nix:
              - added|modified:
                - "flake.nix"
                - "flake.lock"
                - "**/*.nix"

  build-x86:
    runs-on: ubuntu-latest
    needs: check-changed-files
    if: needs.check-changed-files.outputs.has-changes == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: wimpysworld/nothing-but-nix@v10
        with:
          hatchet-protocol: cleave

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            build-dir = /nix/build

      - name: Install nix-fast-build
        run: nix profile add github:Mic92/nix-fast-build

      - uses: cachix/cachix-action@v17
        with:
          name: matrix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build x86
        run: |
          nix-fast-build \
            --flake . \
            --systems x86_64-linux \
            --skip-cached \
            --no-nom

  build-arm:
    runs-on: ubuntu-latest
    needs: check-changed-files
    if: needs.check-changed-files.outputs.has-changes == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Enable aarch64 via QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: wimpysworld/nothing-but-nix@v10
        with:
          hatchet-protocol: cleave

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            build-dir = /nix/build

      - name: Install nix-fast-build
        run: nix profile install github:Mic92/nix-fast-build

      - uses: cachix/cachix-action@v17
        with:
          name: matrix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build ARM
        run: |
          nix-fast-build \
            --flake . \
            --systems aarch64-linux \
            --skip-cached \
            --no-nom \
            --max-jobs 2

  report:
    runs-on: ubuntu-latest
    needs: build-x86
    if: failure() && (inputs.create-issue-on-failure == true || inputs.create-issue-on-failure == '')
    permissions:
      issues: write
    steps:
      - name: Report failures to issue
        uses: actions/github-script@v8
        with:
          script: |
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            const failed = jobs.jobs
              .filter(j => j.conclusion === 'failure' && j.name.includes('build-x86'))
              .map(j => `- \`${j.name}\` — [logs](${j.html_url})`)
              .join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'ci-failure',
              state: 'open'
            });
            const title = 'Flake build failures';
            const body = `## Flake Build Failures\n\n` +
              `**Workflow:** ${context.workflow}\n` +
              `**Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n` +
              `### Failed targets\n${failed || 'Unknown — check run logs'}`;

            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-failure']
              });
            }

  all-systems-passed:
    runs-on: ubuntu-latest
    needs: [check-changed-files, build-x86]
    if: always()
    steps:
      - name: Check build status
        if: >-
          needs.check-changed-files.result == 'failure' ||
          (needs.build-x86.result != 'success' && needs.build-x86.result != 'skipped')
        run: exit 1
