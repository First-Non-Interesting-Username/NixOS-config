name: Flake build
on:
  schedule:
    - cron: "0 8 * * 4"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to checkout"
        required: false
        type: string
      create-issue-on-failure:
        description: "Create issue on failure"
        required: false
        type: boolean
        default: true
      packages:
        description: "JSON array of packages to build"
        required: false
        type: string
        default: "[]"
  pull_request:
    branches: ["main"]
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        required: false
        type: string
        default: ""
      create-issue-on-failure:
        description: "Create issue on failure"
        required: false
        type: boolean
        default: true
      hosts:
        description: "JSON array of hosts to build"
        required: false
        type: string
        default: "[]"
      packages:
        description: "JSON array of packages to build"
        required: false
        type: string
        default: "[]"
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
    outputs:
      built-targets:
        description: "JSON list of targets attempted"
        value: ${{ jobs.discover.outputs.matrix }}

permissions:
  contents: read

jobs:
  check-changed-files:
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.filter.outputs.nix == 'true' || github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            nix:
              - added|modified:
                - "flake.nix"
                - "flake.lock"
                - "**/*.nix"

  discover:
    runs-on: ubuntu-latest
    needs: check-changed-files
    if: needs.check-changed-files.outputs.has-changes == 'true'
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators

      - name: Generate build matrix & target lists
        id: list
        run: |
          HOSTS=$(nix eval .#nixosConfigurations \
            --apply 'n: builtins.map (name: { 
            inherit name; 
            type = "host"; 
            system = n.${name}.config.nixpkgs.system; 
            }) (builtins.attrNames n)' \
            --json)

          PKGS=$(nix eval .#packages \
            --apply 'p: 
              builtins.concatLists (
                builtins.map (system: 
                  builtins.map (name: { 
                    inherit name system; 
                    type = "pkg"; 
                  }) (builtins.attrNames p.${system})
                ) (builtins.attrNames p)
              )' \
            --json)

          H_FILTER='${{ inputs.hosts }}'
          if [ "$H_FILTER" != "[]" ] && [ -n "$H_FILTER" ]; then
            HOSTS=$(echo "$HOSTS" | jq --argjson filter "$H_FILTER" \
              '[.[] | select(.name as $n | $filter | index($n))]')
          fi

          P_FILTER='${{ inputs.packages }}'
          if [ "$P_FILTER" != "[]" ] && [ -n "$P_FILTER" ]; then
            PKGS=$(echo "$PKGS" | jq --argjson filter "$P_FILTER" \
              '[.[] | select(.name as $n | $filter | index($n))]')
          fi

          MATRIX=$(jq -cn --argjson h "$HOSTS" --argjson p "$PKGS" '$h + $p')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: wimpysworld/nothing-but-nix@v10
        with:
          hatchet-protocol: cleave

      - name: Enable aarch64 via QEMU binfmt
        if: matrix.system == 'aarch64-linux'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            build-dir = /nix/build
            ${{ matrix.system == 'aarch64-linux' && 'extra-platforms = aarch64-linux' || '' }}

      - uses: cachix/cachix-action@v17
        with:
          name: matrix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          installCommand: "nix profile add nixpkgs#cachix"

      - name: Build NixOS configurations
        if: needs.discover.outputs.matrix != '[]'
        env:
          MATRIX_CONTEXT: ${{ needs.discover.outputs.matrix }}
        run: |
          HOSTS=$(echo "$MATRIX_CONTEXT" | jq -r --arg sys "${{ matrix.system }}" \
          '.[] | select(.type == "host" and .system == $sys) | .name')

          for host in $HOSTS; do
            echo "::group::Building NixOS config: $host (${{ matrix.system }})"
            nix run github:Mic92/nix-fast-build -- \
              --no-nom \
              --skip-cached \
              --cachix-cache matrix \
              --flake ".#nixosConfigurations.${host}.config.system.build.toplevel"
            echo "::endgroup::"
          done

      - name: Build packages (${{ matrix.system }})
        if: needs.discover.outputs.matrix != '[]'
        env:
          MATRIX_CONTEXT: ${{ needs.discover.outputs.matrix }}
        run: |
          PKGS=$(echo "$MATRIX_CONTEXT" | jq -r --arg sys "${{ matrix.system }}" \
            '.[] | select(.type == "pkg" and .system == $sys) | .name')

          if [ -n "$PKGS" ]; then
            for pkg in $PKGS; do
              echo "::group::Building package: $pkg (${{ matrix.system }})"
              nix run github:Mic92/nix-fast-build -- \
                --systems "${{ matrix.system }}" \
                --no-nom \
                --skip-cached \
                --cachix-cache matrix \
                --flake ".#packages.${{ matrix.system }}.${pkg}"
              echo "::endgroup::"
            done
          fi

  report:
    runs-on: ubuntu-latest
    needs: build
    if: failure() && (inputs.create-issue-on-failure == true || inputs.create-issue-on-failure == '')
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report failures to issue
        uses: actions/github-script@v9
        with:
          script: |
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });

            const failed = jobs.jobs
              .filter(j => j.conclusion === 'failure' && j.name.startsWith('build'))
              .map(j => `- \`${j.name}\` — [logs](${j.html_url})`)
              .join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'ci-failure',
              state: 'open'
            });

            const title = 'Flake build failures';
            const body =
              `## Flake Build Failures\n\n` +
              `**Workflow:** ${context.workflow}\n` +
              `**Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n` +
              `### Failed steps\n${failed || 'Unknown — check run logs'}`;

            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-failure']
              });
            }

  all-systems-passed:
    runs-on: ubuntu-latest
    needs: [check-changed-files, build]
    if: always()
    steps:
      - name: Check build status
        if: >-
          needs.check-changed-files.result == 'failure' ||
          (needs.build.result != 'success' && needs.build.result != 'skipped')
        run: exit 1
