name: Flake build
on:
  schedule:
    - cron: "0 8 * * 4"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to checkout"
        required: false
        type: string
      create-issue-on-failure:
        description: "Create issue on failure"
        required: false
        type: boolean
        default: true
  pull_request:
    branches: ["main"]
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        required: false
        type: string
        default: ""
      create-issue-on-failure:
        description: "Create issue on failure"
        required: false
        type: boolean
        default: true
      hosts:
        description: "JSON array of hosts to build"
        required: false
        type: string
        default: "[]"
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
    outputs:
      built-hosts:
        description: "JSON list of hosts attempted"
        value: ${{ jobs.hosts.outputs.matrix }}

jobs:
  check-changed-files:
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.filter.outputs.nix || github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            nix:
              - added|modified:
                - "flake.nix"
                - "flake.lock"
                - "**/*.nix"

  check:
    needs: check-changed-files
    if: needs.check-changed-files.outputs.has-changes == 'true'
    uses: ./.github/workflows/flake-check.yaml

  hosts:
    runs-on: ubuntu-latest
    needs: check-changed-files
    if: needs.check-changed-files.outputs.has-changes == 'true'
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: DeterminateSystems/nix-installer-action@v21
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            build-dir = /nix/build
      - name: List nixosConfigurations
        id: list
        run: |
          MATRIX=$(nix eval .#nixosConfigurations --apply 'x: builtins.attrNames x' --json)
          FILTER='${{ inputs.hosts }}'
          if [ "$FILTER" != "[]" ] && [ -n "$FILTER" ]; then
            MATRIX=$(echo "$MATRIX" | jq --argjson hosts "$FILTER" '[.[] | select(. as $h | $hosts | index($h))]')
          fi
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: hosts
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.hosts.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Enable aarch64 via QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: wimpysworld/nothing-but-nix@v10
        with:
          hatchet-protocol: cleave

      - uses: DeterminateSystems/nix-installer-action@v21
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            build-dir = /nix/build

      - uses: cachix/cachix-action@v17
        with:
          name: matrix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Add aarch64 as extra platform
        run: |
          echo "extra-platforms = aarch64-linux" | \
            sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon

      - name: Build ${{ matrix.host }}
        id: build
        run: |
          nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel

  report:
    runs-on: ubuntu-latest
    needs: build
    if: failure() && (inputs.create-issue-on-failure == true || inputs.create-issue-on-failure == '')
    permissions:
      issues: write
    steps:
      - name: Report failures to issue
        uses: actions/github-script@v8
        with:
          script: |
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            const failed = jobs.jobs
              .filter(j => j.conclusion === 'failure' && j.name.startsWith('build'))
              .map(j => `- \`${j.name}\` — [logs](${j.html_url})`)
              .join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'ci-failure',
              state: 'open'
            });
            const title = 'Flake build failures';
            const existing = issues.find(i => i.title === title);
            const body = `## Flake Build Failures\n\n` +
              `**Workflow:** ${context.workflow}\n` +
              `**Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n` +
              `**Date:** ${new Date().toUTCString()}\n\n` +
              `### Failed hosts\n${failed || 'Unknown — check run logs'}`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-failure']
              });
            }

  all-systems-passed:
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    steps:
      - name: Check build status
        if: >-
          needs.build.result != 'success' && 
          needs.build.result != 'skipped'
        run: |
          echo "Build result was: ${{ needs.build.result }}"
          exit 1
