name: Flake build

on:
  schedule:
    - cron: "0 8 * * 4"
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  discover:
    name: Discover CI targets
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.matrices.outputs.checks }}
      packages: ${{ steps.matrices.outputs.packages }}
      hosts: ${{ steps.matrices.outputs.hosts }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org/ https://nix-community.cachix.org/ https://matrix.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= matrix.cachix.org-1:uZWavEIj0/oIRHPjh+OG586y4nXBlyI0xkYfZBfDx7w=

      - name: Generate matrices
        id: matrices
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "checks=$(nix eval --json '.#githubActions.checks')" \
            >> "$GITHUB_OUTPUT"

          echo "packages=$(nix eval --json '.#githubActions.packages')" \
            >> "$GITHUB_OUTPUT"

          echo "hosts=$(nix eval --json '.#githubActions.hosts')" \
            >> "$GITHUB_OUTPUT"

  build:
    name: ${{matrix.type}} - ${{ matrix.name }} (${{ matrix.system }})
    needs: discover
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.fullMatrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
        with:
          hatchet-protocol: cleave

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            build-dir = /nix/build

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: matrix
          authToken: "${{matrix.type != 'checks' && secrets.CACHIX_AUTH_TOKEN || ''}}"
          installCommand: "nix profile add nixpkgs#cachix"

      - name: Build check
        run: |
          nix run github:Mic92/nix-fast-build -- \
            --no-nom \
            --skip-cached \
            --cachix-cache matrix \
            --flake '.#${{ matrix.attr }}'

  report:
    runs-on: ubuntu-latest
    needs: build
    if: failure()
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report failures to issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });

            const failed = jobs.jobs
              .filter(j => j.conclusion === 'failure' && j.name.startsWith('build'))
              .map(j => `- \`${j.name}\` — [logs](${j.html_url})`)
              .join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'ci-failure',
              state: 'open'
            });

            const title = 'Flake build failures';
            const body =
              `## Flake Build Failures\n\n` +
              `**Workflow:** ${context.workflow}\n` +
              `**Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n` +
              `### Failed steps\n${failed || 'Unknown — check run logs'}`;

            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-failure']
              });
            }

  all-systems-passed:
    runs-on: ubuntu-latest
    needs: [check-changed-files, build]
    if: always()
    steps:
      - name: Check build status
        if: >-
          needs.check-changed-files.result == 'failure' ||
          (needs.build.result != 'success' && needs.build.result != 'skipped')
        run: exit 1
