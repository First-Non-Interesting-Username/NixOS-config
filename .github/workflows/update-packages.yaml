name: Update packages
on:
  schedule:
    - cron: "0 2 * * 1,4"
  workflow_dispatch:

jobs:
  check:
    uses: ./.github/workflows/flake-check.yaml

  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT }}

      - uses: DeterminateSystems/nix-installer-action@v21
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators

      - uses: cachix/cachix-action@v17
        with:
          name: matrix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Update flake packages
        id: update
        uses: selfuryon/nix-update-action@v1
        with:
          token: ${{ secrets.PAT }}
          pr-title: "chore: biweekly package update"
          pr-labels: dependencies

      - name: Report failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'ci-failure',
              state: 'open'
            });
            const title = 'Package update failed';
            const existing = issues.find(i => i.title === title);
            const body = `## Package Update Failure\n\n` +
              `**Workflow:** ${context.workflow}\n` +
              `**Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n` +
              `**Triggered by:** \`${context.eventName}\`\n` +
              `**Date:** ${new Date().toUTCString()}\n\n` +
              `The package update process failed. Check the run logs above for details.`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-failure']
              });
            }
