name: Flake check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    outputs:
      success:
        description: "Whether the flake check passed"
        value: ${{ jobs.check.outputs.success }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.check.outputs.success }}
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators

      - uses: cachix/cachix-action@v17
        with:
          name: matrix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Run Statix
        run: nix run nixpkgs#statix -- check .

      - name: Run Deadnix and Alejandra
        run: |
          nix run nixpkgs#deadnix -- --edit .
          nix run nixpkgs#alejandra -- .

      - name: Create Pull Request for Fixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: nix format and dead code cleanup"
          title: "Nix Maintenance: Alejandra & Deadnix"
          body: "Automated formatting with Alejandra and unused code removal with Deadnix."
          branch: nix-maintenance
          delete-branch: true

      - name: Enable aarch64 via QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Add aarch64 as extra platform
        run: |
          echo "extra-platforms = aarch64-linux" | \
            sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon

      - name: Check flake
        id: check
        run: |
          nix flake check && echo "success=true" >> $GITHUB_OUTPUT
