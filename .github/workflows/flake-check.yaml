name: Flake check

on:
  push:
  workflow_call:
    outputs:
      success:
        value: ${{ jobs.check.outputs.success }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      success: ${{ steps.check.outputs.success }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: matrix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          installCommand: "nix profile add nixpkgs#cachix"

      - name: Run Nix Fixes and Formatters
        run: |
          nix run nixpkgs#deadnix -- --edit .
          nix run nixpkgs#statix -- fix . \
            --ignore "modules/template.nix" \
            --ignore "hosts/template"
          nix run nixpkgs#alejandra -- .

      - name: Enable aarch64 via QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4
        with:
          platforms: arm64

      - name: Add aarch64 as extra platform
        run: |
          echo "extra-platforms = aarch64-linux" | sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon

      - name: Check flake
        id: check
        run: |
          nix flake check && echo "success=true" >> $GITHUB_OUTPUT

      - name: Check for formatter changes
        id: changes
        if: github.event_name == 'push' && github.ref_name != github.event.repository.default_branch
        run: |
          git diff --exit-code || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Create Maintenance Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "style: nix maintenance (statix, deadnix, alejandra)"
          title: "style: Auto-fixes for ${{ github.ref_name }}"
          body: |
            Automated maintenance for branch `${{ github.ref_name }}`:
            - **Statix**: Fixed linting suggestions.
            - **Deadnix**: Removed unused code.
            - **Alejandra**: Applied standard formatting.
          branch: chore/nix-maintenance-${{ github.ref_name }}
          base: ${{ github.ref_name }}
          delete-branch: true
