name: Flake check

on:
  push:
  pull_request:
  workflow_call:
    outputs:
      success:
        description: "Whether the flake check passed"
        value: ${{ jobs.check.outputs.success }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.check.outputs.success }}
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v21
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators

      - uses: cachix/cachix-action@v17
        with:
          name: matrix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Run Statix
        run: nix run nixpkgs#statix -- check .
        id: statix_run
        continue-on-error: true

      - name: Create Issue on Statix Failure
        if: steps.statix_run.outcome == 'failure'
        run: |
          gh issue create \
            --title "Statix Linting Issues Detected" \
            --body "The Statix check failed in workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Please review the logs and fix the Nix linting errors." \
            --label "statix"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Deadnix and Alejandra
        run: |
          nix run nixpkgs#deadnix -- --edit .
          nix run nixpkgs#alejandra -- .

      - name: Create Pull Request for Fixes
        if: github.event_name == 'push'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: nix format and dead code cleanup"
          title: "Nix Maintenance: Alejandra & Deadnix for ${{ github.ref_name }}"
          body: "Automated formatting fixes for branch `${{ github.ref_name }}`."
          branch: nix-maintenance-${{ github.ref_name }}
          base: ${{ github.ref_name }}
          delete-branch: true

      - name: Enable aarch64 via QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Add aarch64 as extra platform
        run: |
          echo "extra-platforms = aarch64-linux" | \
            sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon

      - name: Check flake
        id: check
        run: |
          nix flake check && echo "success=true" >> $GITHUB_OUTPUT
