name: Flake check

on:
  push:
  pull_request:
  workflow_call:
    outputs:
      success:
        value: ${{ jobs.check.outputs.success }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      success: ${{ steps.check.outputs.success }}
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v21
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators

      - uses: cachix/cachix-action@v17
        with:
          name: matrix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Run Nix Fixes and Formatters
        run: |
          nix run nixpkgs#deadnix -- --edit .
          nix run nixpkgs#statix -- fix . --ignore "modules/template.nix" "hosts/template/*"
          nix run nixpkgs#alejandra -- .

      - name: Create Maintenance Pull Request
        if: github.event_name == 'push'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "style: nix maintenance (statix, deadnix, alejandra)"
          title: "Nix Maintenance: Auto-fixes for ${{ github.ref_name }}"
          body: |
            Automated maintenance for branch `${{ github.ref_name }}`:
            - **Statix**: Fixed linting suggestions.
            - **Deadnix**: Removed unused code.
            - **Alejandra**: Applied standard formatting.
          branch: nix-maintenance-${{ github.ref_name }}
          base: ${{ github.ref_name }}
          delete-branch: true

      - name: Enable aarch64 via QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Add aarch64 as extra platform
        run: |
          echo "extra-platforms = aarch64-linux" | sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon

      - name: Check flake
        id: check
        run: |
          nix flake check && echo "success=true" >> $GITHUB_OUTPUT
