name: Update flake.lock
on:
  schedule:
    - cron: "0 6 * * 3,6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/flake-check.yaml
    permissions:
      contents: write
      pull-requests: write

  update:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.PAT }}

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
                ${{ readFile('.github/nix.conf') }}

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: matrix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          installCommand: "nix profile add nixpkgs#cachix"

      - name: Update flake.lock
        run: nix flake update

      - name: Check for changes
        id: changes
        run: |
          git diff --exit-code flake.lock || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Open PR if changed
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.PAT }}
          commit-message: "deps: update flake.lock"
          title: "chore(deps): biweekly flake.lock update"
          body: |
            Automated `flake.lock` update via `nix flake update`.
            Please review input changes before merging.
          branch: "chore(deps)/flake-lock-update"
          delete-branch: true
          labels: dependencies

  report-failure:
    runs-on: ubuntu-latest
    needs: [check, update]
    if: always() && failure()
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'ci-failure',
              state: 'open'
            });

            const title = 'flake.lock update failed';
            const existing = issues.find(i => i.title === title);
            const body = `## flake.lock Update Failure\n\n` +
              `**Workflow:** ${context.workflow}\n` +
              `**Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n` +
              `**Triggered by:** \`${context.eventName}\`\n` +
              `**Date:** ${new Date().toUTCString()}\n\n` +
              `The flake check or update process failed. Check the run logs above for details.`;

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-failure']
              });
            }
